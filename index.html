<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Rob's Repository</title>
	<style>
	:root {
		color-scheme: dark;
		--bg: #0c1015;
		--panel: #151c24;
		--panel2: #1d2731;
		--line: #35414a;
		--gold: #d5b476;
		--text: #f1ede3;
		--muted: #a7b0b8
	}
	
	* {
		box-sizing: border-box
	}
	
	body {
		margin: 0;
		background: radial-gradient(ellipse at 80% -10%, #293a42, transparent 45%), var(--bg);
		color: var(--text);
		font: 15px/1.55 system-ui, Segoe UI, sans-serif
	}
	
	header {
		border-bottom: 1px solid var(--line);
		padding: 24px max(24px, calc((100vw - 1100px)/2));
		display: flex;
		justify-content: space-between;
		align-items: center;
		gap: 16px
	}
	
	.mark {
		color: var(--gold);
		font-size: 25px
	}
	
	header small {
		color: var(--muted)
	}
	
	main {
		max-width: 1100px;
		margin: auto;
		padding: 55px 24px 90px
	}
	
	.eyebrow {
		color: var(--gold);
		letter-spacing: .24em;
		text-transform: uppercase;
		font-size: 12px;
		font-weight: 700
	}
	
	h1 {
		font: normal clamp(42px, 7vw, 76px)/1.1 Georgia, serif;
		letter-spacing: -.035em;
		margin: 12px 0
	}
	
	h1 span {
		color: var(--gold)
	}
	
	.intro {
		color: var(--muted);
		max-width: 630px;
		font-size: 17px
	}
	
	.toolbar {
		display: flex;
		gap: 12px;
		margin: 36px 0 24px;
		flex-wrap: wrap
	}
	
	input {
		background: #10171d;
		border: 1px solid var(--line);
		border-radius: 10px;
		padding: 15px 17px;
		color: var(--text);
		font: inherit;
		flex: 1;
		min-width: 230px
	}
	
	input:focus {
		outline: 2px solid var(--gold)
	}
	
	button {
		cursor: pointer;
		font: inherit
	}
	
	.crumb {
		color: var(--muted);
		margin-bottom: 18px;
		display: flex;
		gap: 8px;
		flex-wrap: wrap;
		align-items: center
	}
	
	.crumb button {
		border: 0;
		background: none;
		color: var(--gold);
		padding: 3px
	}
	
	.crumb span {
		color: #63727b
	}
	
	.grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
		gap: 15px
	}
	
	.tile {
		background: linear-gradient(145deg, var(--panel), #121920);
		border: 1px solid var(--line);
		border-radius: 14px;
		padding: 20px;
		min-height: 170px;
		display: flex;
		flex-direction: column;
		transition: transform .15s, border-color .15s
	}
	
	.tile:hover {
		transform: translateY(-2px);
		border-color: #9b835b
	}
	
	.tile .symbol {
		font-size: 28px;
		color: var(--gold)
	}
	
	.tile h3 {
		font: normal 23px Georgia, serif;
		margin: 13px 0 5px
	}
	
	.tile p {
		color: var(--muted);
		margin: 0 0 16px;
		font-size: 13px;
		flex: 1
	}
	
	.tile .foot {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 10px;
		color: var(--muted);
		font-size: 12px
	}
	
	.tile button,
	.tile a {
		background: transparent;
		color: var(--gold);
		border: 1px solid #695a40;
		padding: 7px 12px;
		border-radius: 8px;
		text-decoration: none;
		font-size: 13px
	}
	
	.tile button:hover,
	.tile a:hover {
		background: #3a3020
	}
	
	.section {
		margin: 0 0 18px;
		color: var(--gold);
		font-size: 12px;
		letter-spacing: .18em;
		text-transform: uppercase
	}
	
	.empty {
		padding: 40px;
		border: 1px dashed var(--line);
		border-radius: 12px;
		color: var(--muted)
	}
	
	footer {
		max-width: 1100px;
		margin: auto;
		padding: 24px;
		color: #7f8d95;
		border-top: 1px solid var(--line);
		font-size: 13px
	}
	
	@media(max-width:600px) {
		header {
			padding: 20px 24px
		}
		main {
			padding-top: 36px
		}
	}
	</style>
</head>

<body>
	<header>
		<div>
			<div class="mark">⚔ &nbsp; Rob's Repository</div><small>THE ARCHIVE · EST. 2026</small></div><small>Files • Models • Oddities</small></header>
	<main>
		<div class="eyebrow">Welcome to the vault</div>
		<h1>Rob's <span>Repository.</span></h1>
		<p class="intro">A curated collection of things I've made, collected, and shared. Explore the folders, find what you need, and take it with you.</p>
		<div class="toolbar">
			<input id="search" type="search" placeholder="Search the entire repository…" aria-label="Search files and folders"> </div>
		<nav class="crumb" id="breadcrumbs" aria-label="Folder path"></nav>
		<div id="content"></div>
	</main>
	<footer>✦ Rob's Repository · Crafted for the curious.</footer>
	<script>
	/* =====================================================================

	             ROB'S REPOSITORY — EASY EDITING GUIDE

	             1. Add actual files to a /files folder in GitHub repository.

	             2. Edit ONLY the REPOSITORY array below to add folders and downloads.

	             3. A folder uses: {type:'folder', name:'...', children:[ ... ]}

	             4. A file uses: {type:'file', name:'...', url:'files/example.stl'}

	             5. Folders can contain unlimited subfolders. Keep names descriptive.

	             6. To change colors, edit the variables in :root near the top.

	             7. To change page wording, edit the header, h1 and intro above.

	             NOTE: GitHub Pages is public. Do not upload private files.

	             ===================================================================== */
	/* =====================================================================
	 EDIT FOLDERS AND FILES BELOW

	 Only '3D Printing' is active right now.
	 - Add a file: place a { type: 'file', ... } entry inside a children array.
	 - Add a subfolder: place a { type: 'folder', children: [...] } entry
	   inside any existing folder's children array.
	 - Add another TOP-LEVEL folder: uncomment or copy the example entries
	   below. They remain hidden from visitors until uncomment them.
	 ===================================================================== */
	const REPOSITORY = [{
			type: 'folder',
			name: '3D Printing',
			description: '3D Models and 3D Printing things',
			children: [{
					type: 'folder',
					name: '.STEP Files',
					description: '.STEP Files for your enjoyment',
					children: [{
							type: 'file',
							name: 'Parametric SnapLock Storage Box',
							description: 'SnapLock storage box — STEP CAD model',
							url: 'https://github.com/RHopper85/rhopper85.github.io/blob/main/3D%20Print%20Stuff/SnapLock%2BStorage%2Bbox%2B2%2Blatches.step'
						}
						// ADD MORE STEP FILES HERE (separate entries with commas).
					]
				}/*, {
					type: 'folder',
					name: 'Decorative Models',
					description: 'Display pieces and props',
					children: [] // ADD FILES OR SUBFOLDERS HERE.
				}, {
					type: 'folder',
					name: 'Printer Upgrades',
					description: 'Mods and accessories',
					children: [] // ADD FILES OR SUBFOLDERS HERE.
				} */
				// ADD MORE 3D PRINTING SUBFOLDERS HERE (start with a comma).
			]
		},
		/* ===================================================================
		   FUTURE TOP-LEVEL FOLDERS — CURRENTLY HIDDEN

		   Remove this opening comment and the closing comment below to show
		   these example folders again. Or copy one into the active array.
		   The comma after the 3D Printing entry allows these to be uncommented.
		   ===================================================================
		{
		  type: 'folder',
		  name: 'CAD & Design',
		  description: 'Source models and editable designs',
		  children: []
		},
		{
		  type: 'folder',
		  name: 'Graphics & Artwork',
		  description: 'SVGs, decals and design assets',
		  children: []
		},
		{
		  type: 'folder',
		  name: 'Build Projects',
		  description: 'Instructions, plans and project bundles',
		  children: []
		},
		{
		  type: 'folder',
		  name: 'The Miscellany',
		  description: 'Everything that does not fit elsewhere',
		  children: []
		}
		END OF HIDDEN FUTURE FOLDERS ========================================= */
	];
	/* END OF CONTENT YOU NORMALLY NEED TO EDIT. The code below handles

	     folder navigation, breadcrumbs, searching and download links. */
	let path = [];
	const content = document.getElementById('content'),
		crumbs = document.getElementById('breadcrumbs'),
		search = document.getElementById('search');
	const safe = s => String(s).replace(/[&<>"']/g, c => ({
		'&': '&amp;',
		'<': '&lt;',
		'>': '&gt;',
		'"': '&quot;',
		"'": '&#39;'
	}[c]));
	const getFolder = () => path.reduce((items, i) => items[i].children, REPOSITORY);

	function flatten(items, parents = [], out = []) {
		items.forEach((item, i) => {
			out.push({
				item, path: [...parents, i]
			});
			if(item.type === 'folder') flatten(item.children, [...parents, i], out)
		});
		return out
	}

	function draw() {
		const q = search.value.trim().toLowerCase();
		const entries = q ? flatten(REPOSITORY).filter(({
			item, path: p
		}) => [item.name, item.description || '', p.slice(0, -1).reduce((a, i) => a.concat(a.length ? [] : [i]), []).join(' ')].join(' ').toLowerCase().includes(q)) : getFolder().map((item, i) => ({
			item, path: [...path, i]
		}));
		crumbs.innerHTML = '';
		const segments = [{
			name: 'Vault',
			path: []
		}];
		if(!q) {
			let arr = REPOSITORY;
			path.forEach(i => {
				segments.push({
					name: arr[i].name,
					path: segments.length === 1 ? [i] : [...segments[segments.length - 1].path, i]
				});
				arr = arr[i].children
			})
		}
		segments.forEach((s, i) => {
			if(i) crumbs.append(' / ');
			const b = document.createElement('button');
			b.textContent = s.name;
			b.onclick = () => {
				path = s.path;
				search.value = '';
				draw()
			};
			crumbs.append(b)
		});
		if(q) crumbs.append(' / Search results');
		content.innerHTML = entries.length ? '<div class="section">' + (q ? 'Search results' : path.length ? 'Inside this folder' : 'Browse the collection') + ' · ' + entries.length + ' items</div><div class="grid" id="tiles"></div>' : '<div class="empty">' + (q ? 'No matching items. Try another search.' : 'Nothing here yet. Check back later.') + '</div>';
		const grid = document.getElementById('tiles');
		if(!grid) return;
		entries.forEach(({
			item, path: p
		}) => {
			const el = document.createElement('article');
			el.className = 'tile';
			const folder = item.type === 'folder';
			const count = folder ? item.children.length + ' items' : (item.name.split('.').pop() || 'FILE').toUpperCase();
			el.innerHTML = '<div class="symbol">' + (folder ? '▣' : '◇') + '</div><h3>' + safe(item.name) + '</h3><p>' + safe(item.description || (folder ? 'Open this collection' : 'Download this file')) + '</p><div class="foot"><span>' + safe(count) + '</span></div>';
			const action = folder ? document.createElement('button') : document.createElement('a');
			action.textContent = folder ? 'Open folder →' : 'Download ↗';
			if(folder) {
				action.onclick = () => {
					path = p;
					search.value = '';
					draw();
					window.scrollTo({
						top: 0,
						behavior: 'smooth'
					})
				}
			} else {
				action.href = item.url;
				action.setAttribute('download', '');
				action.setAttribute('target', '_blank');
				action.setAttribute('rel', 'noopener noreferrer')
			}
			el.querySelector('.foot').append(action);
			grid.append(el)
		})
	}
	search.addEventListener('input', draw);
	draw();
	</script>
</body>

</html>
